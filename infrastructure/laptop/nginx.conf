# Single entry point for ehans on the laptop: /api/v1 → NestJS API, everything else → Next.js.
# HTTPS ends at Cloudflare; the tunnel connects to this container over plain HTTP on 127.0.0.1.

upstream ehans_api { server backend:4000; }
upstream ehans_web { server frontend:3000; }

# The visitor's real IP (sign-in throttling, logs). Through the Cloudflare tunnel every connection
# comes from cloudflared, which sends the visitor's address in CF-Connecting-IP; direct LAN access
# has no such header, so the connecting address is the visitor. The API trusts exactly one proxy
# hop (TRUST_PROXY=1), i.e. the X-Forwarded-For set below.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# WebSocket upgrade only when the client asks for one (Next.js dev/HMR style connections).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 20m;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $client_ip;
    proxy_set_header X-Forwarded-For   $client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # NOTE: a location that sets any proxy_set_header of its own drops ALL of the ones above
    # (nginx inheritance), and Next.js then rejects Server Actions (forwarded host ≠ origin).
    # Keep every proxy_set_header here, at server level.

    location /api/v1/ {
        proxy_pass http://ehans_api;
    }

    location / {
        proxy_pass http://ehans_web;
    }

    # Admin saves can carry product images (up to 20 × 4 MB; Next.js accepts up to 90 MB).
    # Only client_max_body_size here: proxy_set_header must stay at server level (see above).
    location /admin {
        client_max_body_size 90m;
        proxy_pass http://ehans_web;
    }
}
