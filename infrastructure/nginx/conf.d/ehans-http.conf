# http-context settings shared by the eHans sites.
# Install: /etc/nginx/conf.d/ehans-http.conf  (Ubuntu's nginx.conf includes conf.d/*.conf in `http {}`)

server_tokens off;

# Correlate requests across Nginx, frontend and backend logs.
log_format ehans_main '$remote_addr - [$time_local] "$host" "$request" $status $body_bytes_sent '
                      'rt=$request_time urt=$upstream_response_time '
                      'rid=$request_id "$http_referer" "$http_user_agent"';

# WebSocket / HTTP upgrade support (Next.js dev features, future realtime).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Basic abuse protection. Tune per traffic profile.
limit_req_zone  $binary_remote_addr zone=ehans_api:10m rate=20r/s;
limit_req_zone  $binary_remote_addr zone=ehans_web:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=ehans_conn:10m;
limit_req_status  429;
limit_conn_status 429;

upstream ehans_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream ehans_backend {
    server 127.0.0.1:4000;
    keepalive 32;
}
