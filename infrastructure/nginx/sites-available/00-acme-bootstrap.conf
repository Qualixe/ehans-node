# STEP 1 ONLY: HTTP-only config used to obtain the first certificates.
# Enable it, issue certificates with Certbot, then disable it and enable the real
# site configs (which reference certificate files that must already exist).
# Replace example.com / api.example.com with your real domains.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com api.example.com;

    include snippets/ehans-acme.conf;

    location / {
        return 404;
    }
}
