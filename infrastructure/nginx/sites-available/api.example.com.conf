# API: https://api.example.com  ->  NestJS on 127.0.0.1:4000 (routes under /api/v1)
# Install: /etc/nginx/sites-available/api.example.com.conf, symlink into sites-enabled.
# Replace every "example.com" with your real domain before enabling.

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    include snippets/ehans-acme.conf;

    location / {
        return 301 https://api.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    include snippets/ehans-ssl.conf;

    access_log /var/log/nginx/api.example.com.access.log ehans_main;
    error_log  /var/log/nginx/api.example.com.error.log warn;

    client_max_body_size 10m;
    limit_conn ehans_conn 50;

    # Only the versioned API (and optional Swagger docs) are exposed.
    location /api/ {
        limit_req zone=ehans_api burst=40 nodelay;
        proxy_pass http://ehans_backend;
        include snippets/ehans-proxy.conf;
    }

    location / {
        return 404;
    }
}
