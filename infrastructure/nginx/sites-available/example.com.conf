# Storefront: https://example.com  ->  Next.js on 127.0.0.1:3000
# Install: /etc/nginx/sites-available/example.com.conf, symlink into sites-enabled.
# Replace every "example.com" with your real domain before enabling.

# HTTP: ACME challenges + redirect everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    include snippets/ehans-acme.conf;

    location / {
        return 301 https://example.com$request_uri;
    }
}

# Canonicalize www -> apex.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include snippets/ehans-ssl.conf;

    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include snippets/ehans-ssl.conf;

    access_log /var/log/nginx/example.com.access.log ehans_main;
    error_log  /var/log/nginx/example.com.error.log warn;

    client_max_body_size 5m;
    limit_conn ehans_conn 50;

    # Next.js already sends immutable Cache-Control for /_next/static/*.
    # Avoid `add_header` inside locations: it disables inheritance of the HSTS header.
    location / {
        limit_req zone=ehans_web burst=100 nodelay;
        proxy_pass http://ehans_frontend;
        include snippets/ehans-proxy.conf;
    }
}
