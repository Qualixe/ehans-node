# TLS settings (Mozilla "intermediate" profile).
# Install: /etc/nginx/snippets/ehans-ssl.conf
# Certificates are referenced per server block (issued by Certbot into /etc/letsencrypt/live/).

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ecdh_curve X25519:prime256v1:secp384r1;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

ssl_session_timeout 1d;
ssl_session_cache shared:EhansSSL:10m;
ssl_session_tickets off;

# No OCSP stapling: Let's Encrypt retired its OCSP service in 2025.

# HSTS: start with a short max-age; raise to 63072000 once HTTPS is confirmed everywhere.
add_header Strict-Transport-Security "max-age=31536000" always;
