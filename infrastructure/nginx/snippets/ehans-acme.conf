# Let's Encrypt HTTP-01 challenge (webroot). Used by `certbot certonly --webroot` and renewals.
# Install: /etc/nginx/snippets/ehans-acme.conf ; create the dir: sudo mkdir -p /var/www/certbot

location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
}
